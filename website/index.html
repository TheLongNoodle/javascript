<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Javascript Suite</title>
        <link rel="stylesheet" href="css/main.css" />
        <link rel="stylesheet" href="css/home.css" />
        <link rel="stylesheet" href="css/cards.css" />
        <link rel="stylesheet" href="css/algorithms.css" />
    </head>
    <body>
        <!-- navigation -->
        <header class="top-nav">
            <a href="#home">Javascript Suite</a>
            <nav class="nav-bar">
                <a href="#home">Home</a>
                <a href="#cards">Cards</a>
                <a href="#filters">Filters</a>
                <a href="#algorithms">Algorithms</a>
            </nav>
        </header>
        <!-- home page -->
        <section id="home" class="page">
            <h1>Shalom!</h1>
            <p id="curr-time" class="curr-time"></p>
            <p id="curr-date" class="curr-date"></p>
            <h2><br />Links:</h2>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#cards">Cards</a></li>
                <li><a href="#filters">Filters</a></li>
                <li><a href="#algorithms">Algorithms</a></li>
            </ul>
        </section>
        <!-- cards page -->
        <section id="cards" class="page" style="display: none">
            <div class="card-form">
                <h1>Cards management</h1>
                <div class="card-input">
                    <input type="text" id="name-input" placeholder="Name" />
                    <input type="email" id="email-input" placeholder="Email" />
                    <button id="create-user" type="button">Create</button>
                </div>
            </div>
            <ul id="cards-list" class="cards-list"></ul>
        </section>
        <!-- algorithms -->
        <section id="algorithms" class="page" style="display: none">
            <div class="algo">
                <h1>Algorithms</h1>
                <div class="algo-input">
                    <select id="algorithm">
                        <option value="select">--- Select ---</option>
                        <option value="Palindrome">Palindrome</option>
                        <option value="Prime">Prime</option>
                        <option value="Password">Password</option>
                        <option value="Unique">Unique</option>
                    </select>
                    <input type="text" id="number-input" placeholder="Input" />

                    <p id="output">Select algorithm</p>
                </div>
            </div>
        </section>
        <!-- scripts -->
        <script type="module" src="js/main.js"></script>
        <script type="module" src="js/home.js"></script>
        <script type="module" src="js/cards.js"></script>
        <script type="module" src="js/algorithms.js"></script>
    </body>
</html>
